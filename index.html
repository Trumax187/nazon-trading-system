<div id="root"></div>
<div id="boot-error">

  <p>Reloading the page usually fixes this. If it keeps happening, screenshot the message below.</p>

</div>
<script>
  window.addEventListener("error", function (e) {
    var box = document.getElementById("boot-error");
    var msg = document.getElementById("boot-error-msg");
    if (box && msg && !box.style.display.includes("block")) {
      msg.textContent = (e.error && e.error.stack) || e.message || String(e);
      box.style.display = "block";
    }
  });
  window.addEventListener("unhandledrejection", function (e) {
    var box = document.getElementById("boot-error");
    var msg = document.getElementById("boot-error-msg");
    if (box && msg) {
      msg.textContent = "Unhandled promise rejection: " + ((e.reason && e.reason.stack) || e.reason || "unknown");
      box.style.display = "block";
    }
  });
</script>

      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

      .ll-root {
        --ink-navy: #14203A;
        --ledger-paper: #FBF8F2;
        --ledger-paper-hover: #F1ECDF;
        --ledger-line: #D9CFB8;
        --ink-text: #23293A;
        --ink-text-muted: #746C58;
        --stamp-green: #2F6F4E;
        --stamp-blue: #2A5C8A;
        --stamp-amber: #A9761F;
        --stamp-red: #B33A3A;
        min-height: 100%;
        background: var(--ink-navy);
        background-image: radial-gradient(circle at 10% 0%, rgba(255,255,255,0.04), transparent 40%);
        color: var(--ledger-paper);
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 0 0 28px;
        box-sizing: border-box;
      }
      .ll-root * { box-sizing: border-box; }
      .ll-root--loading { display:flex; align-items:center; justify-content:center; min-height: 260px; }
      .ll-loading { font-family:'IBM Plex Mono', monospace; font-size: 13px; color: rgba(251,248,242,0.7); letter-spacing: 0.04em; }

      .ll-masthead { padding: 22px 18px 16px; display:flex; align-items:flex-start; justify-content:space-between; }
      .ll-masthead h1 { font-family:'Fraunces', serif; font-weight:600; font-size:23px; margin:0; color:#FBF8F2; }
      .ll-tagline { margin:2px 0 0; font-size:11.5px; color: rgba(251,248,242,0.55); letter-spacing:0.04em; }
      .ll-saved { font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color: var(--stamp-green); opacity:0; transition: opacity 0.4s ease; text-align:right; }
      .ll-saved.show { opacity:1; }
      .ll-saved--warn { color: var(--stamp-amber); max-width:110px; line-height:1.4; text-transform:none; letter-spacing:0.02em; }

      .ll-crash { text-align:center; padding: 32px 24px; max-width:320px; }
      .ll-crash-title { font-family:'Fraunces', serif; font-size:18px; color: var(--stamp-red); margin-bottom:8px; }
      .ll-crash-msg { font-family:'IBM Plex Mono', monospace; font-size:12px; color: rgba(251,248,242,0.7); line-height:1.6; margin-bottom:18px; word-break:break-word; }

      .ll-stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding: 0 18px 14px; }
      .ll-stat { background: var(--ledger-paper); border:1px solid var(--ledger-line); border-radius:12px; padding:12px 13px; }
      .ll-stat--overdue { border-color: var(--stamp-red); }
      .ll-stat-icon { color: var(--ink-text-muted); margin-bottom:6px; }
      .ll-stat .label { font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color: var(--ink-text-muted); font-weight:600; }
      .ll-stat .value { font-family:'IBM Plex Mono', monospace; font-size:16.5px; font-weight:600; margin-top:4px; color: var(--ink-text); font-variant-numeric: tabular-nums; }
      .ll-stat--overdue .value { color: var(--stamp-red); }

      .ll-tabbar { display:flex; align-items:center; gap:10px; padding: 4px 18px 12px; }
      .ll-segmented { display:flex; background: rgba(251,248,242,0.08); border-radius:9px; padding:3px; flex:1; }
      .ll-segmented button { flex:1; border:none; background:transparent; color: rgba(251,248,242,0.65); font-family:'Inter'; font-size:12.5px; font-weight:600; padding:7px 8px; border-radius:7px; cursor:pointer; }
      .ll-segmented button.active { background: var(--ledger-paper); color: var(--ink-text); }
      .ll-add-btn { width:36px; height:36px; border-radius:9px; border:1px solid rgba(251,248,242,0.25); background: rgba(251,248,242,0.08); color: var(--ledger-paper); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
      .ll-add-btn:active { background: rgba(251,248,242,0.18); }

      .ll-chip-row { display:flex; gap:7px; padding: 0 18px 12px; overflow-x:auto; }
      .ll-chip { flex-shrink:0; border:1px solid rgba(251,248,242,0.22); background:transparent; color: rgba(251,248,242,0.75); font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:99px; cursor:pointer; font-family:'Inter'; }
      .ll-chip.active { background: var(--ledger-paper); color: var(--ink-text); border-color: var(--ledger-paper); }

      .ll-ledger-card { margin: 0 18px 16px; background: var(--ledger-paper); border-radius:14px; border:1px solid var(--ledger-line); overflow:hidden; }
      .ll-loan-row { display:flex; align-items:center; justify-content:space-between; padding:13px 15px; border-bottom:1px dashed var(--ledger-line); cursor:pointer; gap:10px; }
      .ll-loan-row:last-child { border-bottom:none; }
      .ll-loan-row:active { background: var(--ledger-paper-hover); }
      .ll-loan-name { font-weight:600; font-size:14px; color: var(--ink-text); }
      .ll-loan-sub { font-size:11px; color: var(--ink-text-muted); margin-top:2px; }
      .ll-loan-row-right { text-align:right; flex-shrink:0; }
      .ll-loan-balance { font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:14px; color: var(--ink-text); margin-bottom:5px; font-variant-numeric: tabular-nums; }

      .ll-stamp { display:inline-block; padding:3px 9px; border:1.5px solid currentColor; border-radius:4px; font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; transform: rotate(-3deg); position:relative; }
      .ll-stamp::after { content:''; position:absolute; inset:1.5px; border:1px solid currentColor; border-radius:2px; opacity:0.45; pointer-events:none; }
      .ll-stamp--active { color: var(--stamp-blue); }
      .ll-stamp--dueSoon { color: var(--stamp-amber); }
      .ll-stamp--overdue { color: var(--stamp-red); }
      .ll-stamp--cleared { color: var(--stamp-green); }

      .ll-empty { margin:0 18px 16px; padding:28px 18px; text-align:center; background: rgba(251,248,242,0.05); border:1px dashed rgba(251,248,242,0.25); border-radius:14px; }
      .ll-empty.compact { padding:18px; }
      .ll-empty-title { font-family:'Fraunces', serif; font-size:15px; color: var(--ledger-paper); margin-bottom:4px; }
      .ll-empty-body { font-size:12px; color: rgba(251,248,242,0.55); line-height:1.5; }

      .ll-detail { padding: 4px 18px 8px; }
      .ll-back { display:flex; align-items:center; gap:6px; background:none; border:none; color: rgba(251,248,242,0.75); font-family:'Inter'; font-size:12.5px; font-weight:600; cursor:pointer; padding:8px 0 14px; }
      .ll-detail-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; gap:10px; }
      .ll-detail-head h2 { font-family:'Fraunces', serif; font-size:19px; margin:0; color:#FBF8F2; }
      .ll-muted { font-size:11.5px; color: rgba(251,248,242,0.55); margin:3px 0 0; }

      .ll-detail-card { padding: 4px 15px; }
      .ll-detail-line { display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px dashed var(--ledger-line); gap:12px; }
      .ll-detail-line:last-child { border-bottom:none; }
      .ll-detail-line.emphasis .ll-detail-value { font-weight:700; font-size:15px; }
      .ll-detail-label { display:flex; align-items:center; gap:6px; font-size:12px; color: var(--ink-text-muted); font-weight:600; }
      .ll-detail-value { font-family:'IBM Plex Mono', monospace; font-size:13px; color: var(--ink-text); text-align:right; font-variant-numeric: tabular-nums; }
      .accent-overdue { color: var(--stamp-red); }

      .ll-section-head { display:flex; align-items:center; justify-content:space-between; padding: 8px 0 10px; }
      .ll-section-head h3 { font-family:'Fraunces', serif; font-size:14.5px; color:#FBF8F2; margin:0; }

      .ll-payment-row { display:flex; align-items:center; justify-content:space-between; padding:11px 15px; border-bottom:1px dashed var(--ledger-line); font-size:12.5px; color: var(--ink-text); }
      .ll-payment-row:last-child { border-bottom:none; }
      .ll-payment-row strong { font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

      .ll-remind-note { display:flex; align-items:center; gap:7px; font-size:11px; color: rgba(251,248,242,0.5); padding: 10px 2px 12px; line-height:1.5; }

      .ll-notify-row { display:flex; align-items:center; justify-content:space-between; padding:12px 15px; border-bottom:1px dashed var(--ledger-line); gap:10px; }
      .ll-notify-row:last-child { border-bottom:none; }
      .ll-notify-label { font-size:12.5px; font-weight:600; color: var(--ink-text); }
      .ll-notify-actions { display:flex; gap:6px; flex-shrink:0; }
      .ll-notify-btn { display:flex; align-items:center; gap:5px; padding:6px 10px; border-radius:8px; border:1px solid var(--ledger-line); background:#fff; color: var(--ink-text-muted); font-size:11px; font-weight:600; text-decoration:none; }
      .ll-notify-btn--wa { border-color: rgba(47,111,78,0.3); color: var(--stamp-green); }

      .ll-modal-overlay { position:fixed; inset:0; background: rgba(14,23,41,0.72); display:flex; align-items:flex-end; z-index:50; backdrop-filter: blur(2px); }
      .ll-modal-sheet { background: var(--ledger-paper); width:100%; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding: 6px 18px 24px; animation: ll-sheet-up 0.22s ease; }
      @keyframes ll-sheet-up { from { transform: translateY(16px); opacity:0.6; } to { transform: translateY(0); opacity:1; } }
      .ll-modal-header { display:flex; align-items:center; justify-content:space-between; padding: 14px 0 10px; position:sticky; top:0; background: var(--ledger-paper); }
      .ll-modal-header h2 { font-family:'Fraunces', serif; font-size:17px; margin:0; color: var(--ink-text); }
      .ll-icon-btn { width:30px; height:30px; border-radius:8px; border:1px solid var(--ledger-line); background:transparent; color: var(--ink-text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; }

      .ll-form { display:flex; flex-direction:column; gap:12px; padding-bottom: 6px; }
      .ll-field { display:flex; flex-direction:column; gap:5px; }
      .ll-field span { font-size:11.5px; font-weight:600; color: var(--ink-text-muted); letter-spacing:0.02em; }
      .ll-field input, .ll-field select { border:1px solid var(--ledger-line); border-radius:9px; padding:10px 11px; font-family:'Inter'; font-size:14px; color: var(--ink-text); background:#fff; }
      .ll-field input:focus, .ll-field select:focus { outline:2px solid var(--stamp-blue); outline-offset:1px; }
      .ll-field-divider { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color: var(--ink-text-muted); border-top:1px dashed var(--ledger-line); padding-top:12px; margin-top:2px; }

      .ll-form .ll-segmented { background: #F1ECDF; }
      .ll-form .ll-segmented button { color: var(--ink-text-muted); }
      .ll-form .ll-segmented button.active { background: var(--ink-navy); color: #FBF8F2; }

      .ll-preview { display:flex; align-items:center; justify-content:space-between; background:#F1ECDF; border:1px solid var(--ledger-line); border-radius:10px; padding:11px 13px; }
      .ll-preview span { font-size:11.5px; font-weight:600; color: var(--ink-text-muted); }
      .ll-preview strong { font-family:'IBM Plex Mono', monospace; font-size:15px; color: var(--ink-text); }

      .ll-empty-note { font-size:12.5px; color: var(--ink-text-muted); background:#F1ECDF; border-radius:9px; padding:11px; }
      .ll-link-btn { background:none; border:none; color: var(--stamp-blue); font-weight:700; text-decoration:underline; cursor:pointer; padding:0; font-size:12.5px; }

      .ll-masthead-right { display:flex; flex-direction:column; align-items:flex-end; gap:7px; }
      .ll-lock-btn { width:28px; height:28px; border-radius:8px; border:1px solid rgba(251,248,242,0.25); background: rgba(251,248,242,0.08); color: var(--ledger-paper); display:flex; align-items:center; justify-content:center; cursor:pointer; }
      .ll-lock-btn:active { background: rgba(251,248,242,0.18); }

      .ll-lock { display:flex; flex-direction:column; align-items:center; gap:6px; padding: 20px; }
      .ll-lock-title { font-family:'Fraunces', serif; font-size:19px; color:#FBF8F2; }
      .ll-lock-sub { font-family:'IBM Plex Mono', monospace; font-size:11.5px; color: rgba(251,248,242,0.55); margin-bottom:10px; letter-spacing:0.04em; }
      .ll-lock-dots { display:flex; gap:14px; margin-bottom:26px; }
      .ll-lock-dots span { width:12px; height:12px; border-radius:50%; border:1.5px solid rgba(251,248,242,0.4); }
      .ll-lock-dots span.filled { background: var(--ledger-paper); border-color: var(--ledger-paper); }
      .ll-lock-pad { display:grid; grid-template-columns: repeat(3, 64px); gap:14px; }
      .ll-lock-key { width:64px; height:64px; border-radius:50%; border:1px solid rgba(251,248,242,0.22); background: rgba(251,248,242,0.06); color: var(--ledger-paper); font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; cursor:pointer; }
      .ll-lock-key:active { background: rgba(251,248,242,0.16); }
      .ll-lock-key--back { font-size:16px; }
      .ll-lock-forgot { margin-top:26px; background:none; border:none; color: rgba(251,248,242,0.45); font-family:'Inter'; font-size:12px; font-weight:600; text-decoration:underline; cursor:pointer; }

      .ll-btn--danger { background:transparent; border-color: rgba(179,58,58,0.4); color: var(--stamp-red); }

      .ll-form-error { font-size:12.5px; font-weight:600; color: var(--stamp-red); background: rgba(179,58,58,0.08); border:1px solid rgba(179,58,58,0.35); border-radius:9px; padding:9px 11px; }

      .ll-form-actions { display:flex; gap:10px; padding-top:6px; }
      .ll-btn { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:5px; border-radius:10px; padding:11px; font-family:'Inter'; font-size:13.5px; font-weight:700; cursor:pointer; border:1px solid transparent; }
      .ll-btn--primary { background: var(--ink-navy); color:#FBF8F2; }
      .ll-btn--primary:disabled { opacity:0.4; cursor:not-allowed; }
      .ll-btn--ghost { background:transparent; border-color: var(--ledger-line); color: var(--ink-text-muted); }
      .ll-btn--small { flex:none; padding:7px 12px; font-size:12px; background: rgba(251,248,242,0.1); color:#FBF8F2; border:1px solid rgba(251,248,242,0.25); }

      .ll-payment-row-right { display:flex; align-items:center; gap:10px; }
      .ll-receipt-icon-btn { width:26px; height:26px; border-radius:7px; border:1px solid var(--ledger-line); background:transparent; color: var(--ink-text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }

      .ll-receipt { background:#fff; color:#1a1a1a; border-radius:14px; padding:22px 20px; margin: 0 0 14px; border:1px solid var(--ledger-line); }
      .ll-receipt-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; gap:10px; }
      .ll-receipt-brand { font-family:'Fraunces', serif; font-size:19px; font-weight:700; }
      .ll-receipt-type { font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:#746C58; margin-top:2px; }
      .ll-receipt-meta { text-align:right; font-size:10px; color:#746C58; font-family:'IBM Plex Mono', monospace; line-height:1.6; }
      .ll-receipt-rule { border-top:1px dashed #D9CFB8; margin: 13px 0; }
      .ll-receipt-block { margin-bottom: 8px; }
      .ll-receipt-label { font-size:10px; text-transform:uppercase; letter-spacing:0.07em; color:#746C58; font-weight:600; }
      .ll-receipt-value-lg { font-family:'IBM Plex Mono', monospace; font-size:16px; font-weight:700; color:#1a1a1a; margin-top:2px; display:block; }
      .ll-receipt-sub { font-size:11.5px; color:#4a4a4a; margin-top:2px; }
      .ll-receipt-grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; margin: 10px 0; }
      .ll-receipt-line { display:flex; flex-direction:column; }
      .ll-receipt-value { font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:#1a1a1a; margin-top:2px; }
      .ll-receipt-table { width:100%; border-collapse:collapse; font-size:11px; margin-top:8px; }
      .ll-receipt-table th { text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:#746C58; padding:6px 4px; border-bottom:1px solid #D9CFB8; }
      .ll-receipt-table td { padding:6px 4px; border-bottom:1px dashed #eee; font-family:'IBM Plex Mono', monospace; }
      .ll-receipt-footer { text-align:center; font-size:10.5px; color:#746C58; margin-top:14px; }
      .ll-receipt-print-btn { width:100%; }

      @media print {
        body * { visibility: hidden; }
        .ll-receipt, .ll-receipt * { visibility: visible; }
        .ll-receipt { position: absolute; top:0; left:0; width:100%; margin:0; border-radius:0; border:none; }
        .no-print { display: none !important; }
      }

      @media (prefers-reduced-motion: reduce) {
        .ll-modal-sheet { animation:none; }
      }
